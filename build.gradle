plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex('software\\.bernie.*')
			includeGroup('com.eliotlash.mclib')
		}
	}
}

// In-game tests (Fabric GameTest), run by runGametest on a headless server. Its own mod, never in the jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/embervoid.accesswidener")

	mods {
		"embervoid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"embervoid-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name = "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
		}
		// Dedicated server for tools/server_check.py: boots, generates realm and Sanctum chunks, scans the log.
		serverCheck {
			server()
			name = "Server Check"
			runDir "run/server-check"
		}
	}
}

// A fresh world and default config for every run, so results never depend on the previous one.
tasks.named('runGametest') {
	doFirst {
		delete "build/gametest/world", "build/gametest/junit.xml", "build/gametest/config/embervoid.json"
	}
}

fabricApi {
	configureDataGeneration()
}

// The datagen entrypoint lives in the client source set.
loom.runs.datagen.source(sourceSets.client)

// configureDataGeneration() already adds src/main/generated to main resources; keep datagen's cache out of the jar.
sourceSets.main.resources {
	exclude '.cache/**'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Required at runtime by players too (animated mobs and bosses).
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Dev-only: mod list in runClient. Not bundled, not required by players.
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit tests for pure logic.
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// Tests see the mod's main classes and Minecraft (split source sets keep them off the test classpath otherwise).
sourceSets.test {
	compileClasspath += sourceSets.main.compileClasspath
	runtimeClasspath += sourceSets.main.runtimeClasspath
}

test {
	useJUnitPlatform()
}

[processResources, processGametestResources].each {
	it.configure {
		inputs.property "version", project.version

		filesMatching("fabric.mod.json") {
			expand "version": project.version
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
