name: Release

# Push a tag like v0.2.0 to publish a GitHub release with the mod jar.
# The tag (without the leading "v") overrides mod_version from gradle.properties.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace -Pmod_version="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "Embervoid $GITHUB_REF_NAME" \
            --generate-notes
