name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Validates the Gradle wrapper and caches Gradle/Loom downloads.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: embervoid-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
